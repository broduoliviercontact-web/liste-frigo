<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste Frigo - Preview e-paper</title>
  <style>
    :root { color-scheme: light; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #d8d8d2; }
    .screen { width: 540px; height: 960px; background: #f7f6ef; border: 6px solid #111; box-sizing: border-box; position: relative; color: #111; overflow: hidden; }
    header { height: 150px; border-bottom: 4px solid #111; display: flex; align-items: center; gap: 22px; padding: 0 56px; box-sizing: border-box; }
    h1 { font-size: 64px; margin: 0; line-height: 1; max-width: 300px; overflow: hidden; white-space: nowrap; }
    .switch { width: 52px; height: 52px; border: 5px solid #111; display: grid; place-items: center; font-size: 34px; }
    .summary { position: absolute; top: 176px; left: 62px; font-size: 24px; }
    .summary strong { font-size: 56px; }
    .range { position: absolute; top: 194px; right: 82px; font-size: 24px; color: #555; }
    .items { position: absolute; top: 220px; left: 62px; right: 82px; }
    .item { height: 62px; border-bottom: 2px solid #111; display: flex; align-items: flex-start; gap: 32px; font-size: 50px; line-height: 1; overflow: hidden; }
    .box { width: 34px; height: 34px; border: 4px solid #111; margin-top: 7px; flex: 0 0 auto; display: grid; place-items: center; font-size: 26px; }
    .item span:last-child { margin-top: 4px; max-width: 285px; overflow: hidden; white-space: nowrap; }
    .arrow { width: 44px; height: 56px; border: 4px solid #111; display: grid; place-items: center; font-size: 32px; }
    .actions { position: absolute; left: 32px; right: 32px; top: 632px; border-top: 4px solid #111; padding-top: 18px; }
    .primary { height: 54px; background: #111; color: #f7f6ef; display: grid; place-items: center; font-size: 22px; margin: 0 30px 16px; }
    .twins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 30px; }
    .twins div { height: 46px; border: 3px solid #111; display: grid; place-items: center; font-size: 22px; }
    .sync { text-align: center; margin-top: 26px; font-size: 24px; }
    nav { position: absolute; left: 32px; right: 32px; bottom: 20px; border-top: 4px solid #111; display: grid; grid-template-columns: repeat(5, 1fr); padding-top: 4px; }
    nav div { height: 66px; display: grid; place-items: center; font-size: 18px; }
    nav div:first-child { background: #111; color: #f7f6ef; }
  </style>
</head>
<body>
  <div class="screen">
    <header><h1>Maison</h1><div class="arrow">↓</div></header>
    <div class="summary"><strong>5</strong> articles a acheter</div><div class="range">1-6/7</div>
    <div class="items">
      <div class="item"><span class="box"></span><span>a eta et</span></div>
      <div class="item"><span class="box"></span><span>a eta et</span></div>
      <div class="item"><span class="box"></span><span>a eta et</span></div>
      <div class="item"><span class="box">✓</span><span>er er</span></div>
      <div class="item"><span class="box">✓</span><span>abababa</span></div>
      <div class="item"><span class="box"></span><span>lait</span></div>
    </div>
    <section class="actions"><div class="primary">ECRIRE</div><div class="twins"><div>CLAVIER</div><div>EFFACER</div></div><div class="sync">SYNCHRONISE</div></section>
    <nav><div>Listes</div><div>Creche</div><div>Tenues</div><div>Velib</div><div>Transp</div></nav>
  </div>
</body>
</html>
